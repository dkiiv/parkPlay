<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<title>ParkPlay - YouTube sign-in</title>
</head>
<body class="app">
  <!-- Icons are inline SVG: the Tesla browser lacks many Unicode symbol glyphs (they render as boxes). -->
  <!-- Icon path data derived from Google Material Icons (Apache-2.0); see THIRD_PARTY_NOTICES.md -->
  <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15.4 4.6 8 12l7.4 7.4-1.4 1.4L5.2 12 14 3.2z"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M8.6 19.4 16 12 8.6 4.6 10 3.2l8.8 8.8-8.8 8.8z"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M17.7 6.3A8 8 0 1 0 19.7 14h-2.1a6 6 0 1 1-1.4-6.2L13 11h7V4z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></symbol>
    <symbol id="i-kbd" viewBox="0 0 24 24"><path d="M20 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zM11 8h2v2h-2zm0 3h2v2h-2zM8 8h2v2H8zm0 3h2v2H8zm-1 2H5v-2h2zm0-3H5V8h2zm9 7H8v-2h8zm0-4h-2v-2h2zm0-3h-2V8h2zm3 3h-2v-2h2zm0-3h-2V8h2z"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></symbol>
    <symbol id="i-bksp" viewBox="0 0 24 24"><path d="M22 4H8L1 12l7 8h14zm-3 11.6L17.6 17 14 13.4 10.4 17 9 15.6l3.6-3.6L9 8.4 10.4 7l3.6 3.6L17.6 7 19 8.4 15.4 12z"/></symbol>
    <symbol id="i-enter" viewBox="0 0 24 24"><path d="M19 7v4H5.8l3.6-3.6L8 6l-6 6 6 6 1.4-1.4L5.8 13H21V7z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4l5.6 5.6L5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  </svg>

  <header id="bar">
    <span class="bartitle">Sign in to YouTube</span>
    <button id="b-back" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-back" xlink:href="#i-back"/></svg></button>
    <button id="b-fwd" hidden aria-label="Forward"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-fwd" xlink:href="#i-fwd"/></svg></button>
    <button id="b-reload" aria-label="Reload"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-reload" xlink:href="#i-reload"/></svg></button>
    <button id="b-home" hidden aria-label="Home"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-home" xlink:href="#i-home"/></svg></button>
    <form id="urlform" autocomplete="off" hidden>
      <input id="url" type="text" inputmode="search" enterkeyhint="go" spellcheck="false"
             autocapitalize="off" autocorrect="off" placeholder="Search YouTube or type a URL">
    </form>
    <button id="b-kbd" aria-label="Keyboard"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-kbd" xlink:href="#i-kbd"/></svg></button>
    <select id="preset" aria-label="Quality">
      <option value="low">Low</option>
      <option value="med">Med</option>
      <option value="high">High</option>
    </select>
    <a id="b-done" href="/" class="donebtn">Done</a>
    <button id="b-full" aria-label="Hide bar" style="display:none"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-full" xlink:href="#i-full"/></svg></button>
    <span id="net" class="net-bad" aria-label="Connection"></span>
  </header>

  <main id="stage">
    <canvas id="screen"></canvas>
    <div id="start" class="overlay">
      <button id="b-start"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-play" xlink:href="#i-play"/></svg><span>Tap to start</span></button>
      <p class="hint">Sign in to YouTube once in this remote browser. Your account then appears in ParkPlay. Tap Done when finished.</p>
    </div>
    <div id="status" class="toast hidden"></div>
  </main>

  <div id="typebar" class="hidden">
    <input id="typer" type="text" enterkeyhint="send" spellcheck="false" autocapitalize="off"
           autocorrect="off" autocomplete="off" placeholder="Type here - it goes into the page">
    <button id="t-bksp" aria-label="Backspace"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bksp" xlink:href="#i-bksp"/></svg></button>
    <button id="t-enter" aria-label="Enter"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-enter" xlink:href="#i-enter"/></svg></button>
    <button id="t-close" aria-label="Close keyboard"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close" xlink:href="#i-close"/></svg></button>
  </div>

  <button id="b-showbar" class="hidden" aria-label="Show bar"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu" xlink:href="#i-menu"/></svg></button>

  <script>
    window.addEventListener('error', function (e) {
      try { navigator.sendBeacon('/api/clientlog', JSON.stringify({ msg: String(e.message), src: e.filename, line: e.lineno, col: e.colno, ua: navigator.userAgent })); } catch (x) {}
    });
  </script>
  <script src="/vendor/jsmpeg.min.js"></script>
  <script src="/signin.js"></script>
</body>
</html>
