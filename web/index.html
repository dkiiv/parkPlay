<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<title>ParkPlay</title>
<script>
  window.addEventListener('error', function (e) {
    try { navigator.sendBeacon('/api/clientlog', JSON.stringify({ msg: String(e.message), src: e.filename, line: e.lineno, col: e.colno })); } catch (x) {}
  });
  window.addEventListener('unhandledrejection', function (e) {
    try { navigator.sendBeacon('/api/clientlog', JSON.stringify({ msg: 'unhandled: ' + String(e.reason && e.reason.message || e.reason) })); } catch (x) {}
  });
</script>
</head>
<body class="tv">
  <!-- Inline SVG icons: the Tesla browser lacks many Unicode symbol glyphs. -->
  <!-- Icon path data derived from Google Material Icons (Apache-2.0); see THIRD_PARTY_NOTICES.md -->
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></symbol>
    <symbol id="i-subs" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm2-4h12v2H6zm14 8H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-10 9v-6l5 3z"/></symbol>
    <symbol id="i-hist" viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2.1 5l-1.4 1.4A9 9 0 1 0 13 3zm-1 5v5l4.3 2.5.7-1.2-3.5-2.1V8z"/></symbol>
    <symbol id="i-later" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.2 14.2L11 13V7h1.5v5.2l4.5 2.7z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15.4 4.6 8 12l7.4 7.4-1.4 1.4L5.2 12 14 3.2z"/></symbol>
    <symbol id="i-rew" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" font-size="7" text-anchor="middle" font-family="sans-serif" font-weight="700">10</text></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.5" font-size="7" text-anchor="middle" font-family="sans-serif" font-weight="700">10</text></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></symbol>
  </svg>

  <!-- ===== browse view ===== -->
  <section id="browse">
    <nav id="rail">
      <div class="logo"><svg width="34" height="34" viewBox="0 0 64 64" aria-label="ParkPlay"><rect width="64" height="64" rx="14" fill="#1e293b"/><path d="M19 13h15a14 14 0 0 1 0 28h-6v10h-9z" fill="#14b8a6"/><path d="M29 20v14l11-7z" fill="#1e293b"/></svg></div>
      <button class="tab active" data-kind="home"><svg width="26" height="26"><use href="#i-home"/></svg><span>Home</span></button>
      <button class="tab" data-kind="subs"><svg width="26" height="26"><use href="#i-subs"/></svg><span>Subs</span></button>
      <button class="tab" data-kind="history"><svg width="26" height="26"><use href="#i-hist"/></svg><span>History</span></button>
      <button class="tab" data-kind="later"><svg width="26" height="26"><use href="#i-later"/></svg><span>Later</span></button>
      <div class="spacer"></div>
      <button class="tab" id="b-account"><svg width="26" height="26"><use href="#i-user"/></svg><span id="acct-label">Account</span></button>
    </nav>
    <div id="main">
      <form id="searchbar" autocomplete="off">
        <svg width="22" height="22"><use href="#i-search"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="Search YouTube" spellcheck="false" autocapitalize="off" autocorrect="off">
      </form>
      <div id="feed-head">
        <h2 id="feed-title">Home</h2>
        <button id="b-refresh" class="ic" aria-label="Refresh"><svg width="26" height="26"><use href="#i-refresh"/></svg><span>Refresh</span></button>
      </div>
      <div id="grid"></div>
      <div id="feed-msg" class="hidden"></div>
    </div>
  </section>

  <!-- ===== watch view ===== -->
  <section id="watch" class="hidden">
    <div id="stage">
      <canvas id="screen"></canvas>
      <div id="spinner" class="hidden"><div class="ring"></div><div id="spin-text">Loading</div></div>
      <div id="overlay">
        <div id="ov-top">
          <button id="w-back" class="ic"><svg width="30" height="30"><use href="#i-back"/></svg></button>
          <div id="w-title"></div>
        </div>
        <div id="ov-mid">
          <button id="w-rew" class="ic big"><svg width="44" height="44"><use href="#i-rew"/></svg></button>
          <button id="w-play" class="ic huge"><svg width="64" height="64"><use id="w-play-ic" href="#i-pause"/></svg></button>
          <button id="w-fwd" class="ic big"><svg width="44" height="44"><use href="#i-fwd"/></svg></button>
        </div>
        <div id="ov-bot">
          <span id="t-cur">0:00</span>
          <div id="seek"><div id="seek-buf"></div><div id="seek-fill"></div><div id="seek-knob"></div></div>
          <span id="t-dur">0:00</span>
          <select id="w-q" aria-label="Quality"><option value="360">360p</option><option value="480">480p</option><option value="720" selected>720p</option><option value="1080">1080p</option></select>
          <button id="w-full" class="ic"><svg width="28" height="28"><use href="#i-full"/></svg></button>
        </div>
      </div>
    </div>
    <div id="w-info"><div id="w-chan"></div><div id="w-buf"></div></div>
  </section>

  <!-- ===== account sheet ===== -->
  <div id="sheet" class="hidden">
    <div class="sheet-card">
      <h3>YouTube account</h3>
      <p id="acct-state">Checking...</p>
      <a class="btn primary" href="/signin">Sign in with Google</a>
      <p class="small">Opens a one-time remote browser to sign in to YouTube. After that, Home, Subscriptions, History and Watch later are yours.</p>
      <button class="btn" id="b-signout">Sign out</button>
      <button class="btn" id="b-sheet-close">Close</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="/fmp4.js"></script>
  <script src="/player.js"></script>
  <script src="/app.js"></script>
</body>
</html>
